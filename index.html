<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiveM Enhanced Crash Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mapViewport">
    <div id="mapStage">
      <img id="mapImage" src="map.png" alt="FiveM Enhanced crash map" draggable="false">
      <svg id="zonesLayer" viewBox="0 0 1408 1082" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div id="toolbar">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="resetView">Reset</button>
    <button id="editorToggle">Add zones: OFF</button>
  </div>

  <div id="status">Drag to move • Mouse wheel to zoom</div>

  <dialog id="zoneDialog">
    <form method="dialog">
      <h2>Crash zone</h2>
      <label>
        Name
        <input id="zoneName" maxlength="60" placeholder="Example: Vinewood crash area">
      </label>
      <label>
        Radius
        <input id="zoneRadius" type="range" min="20" max="220" value="70">
      </label>
      <div class="dialogButtons">
        <button value="cancel">Cancel</button>
        <button id="saveZone" value="default">Save</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
