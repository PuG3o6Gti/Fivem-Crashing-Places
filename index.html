<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiveM Crash Map</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}#vp{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}#stage{position:absolute;width:1408px;height:1082px;transform-origin:0 0;user-select:none}#stage img,#zones{position:absolute;inset:0;width:1408px;height:1082px}#stage img{pointer-events:none}.zone{fill:#f003;stroke:red;stroke-width:7;vector-effect:non-scaling-stroke;cursor:pointer}.zone.sel{stroke:#fff;stroke-width:9;stroke-dasharray:12 8}.handle{fill:#fff;stroke:red;stroke-width:5;vector-effect:non-scaling-stroke;cursor:ew-resize}.label{fill:#fff;stroke:#000;stroke-width:4;paint-order:stroke;font-size:24px;font-weight:bold;pointer-events:none}#bar{position:fixed;top:14px;right:14px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button{height:44px;border:0;border-radius:9px;background:#161616e8;color:#fff;font-weight:bold;padding:0 14px;cursor:pointer}button.on{background:#b40000}button:disabled{opacity:.45}#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;background:#161616d9;color:#fff;padding:9px 14px;border-radius:9px;text-align:center}dialog{border:0;border-radius:12px;padding:20px;width:min(92vw,420px)}dialog form{display:grid;gap:14px}dialog label{display:grid;gap:6px;font-weight:bold}input{padding:9px}.actions{display:flex;justify-content:flex-end;gap:8px}
</style></head><body>
<div id="vp"><div id="stage"><img src="map.png" alt="FiveM map" draggable="false"><svg id="zones" viewBox="0 0 1408 1082"></svg></div></div>
<div id="bar"><button id="zin">+</button><button id="zout">−</button><button id="reset">Reset</button><button id="edit">Edit: OFF</button><button id="del" disabled>Delete selected</button></div><div id="help">Drag to move • Mouse wheel to zoom</div>
<dialog id="dlg"><form method="dialog"><h2>New crash zone</h2><label>Name<input id="name" maxlength="60"></label><label>Radius<input id="rad" type="range" min="20" max="220" value="70"></label><div class="actions"><button value="cancel">Cancel</button><button value="save">Save</button></div></form></dialog>
<script>
const vp=document.querySelector('#vp'),stage=document.querySelector('#stage'),svg=document.querySelector('#zones'),editBtn=document.querySelector('#edit'),delBtn=document.querySelector('#del'),help=document.querySelector('#help'),dlg=document.querySelector('#dlg'),nameIn=document.querySelector('#name'),radIn=document.querySelector('#rad');
const W=1408,H=1082;let s=1,tx=0,ty=0,edit=false,sel=null,mapDrag=null,act=null,pending=null;let zones=JSON.parse(localStorage.getItem('fivemCrashZones')||'[]');
const save=()=>localStorage.setItem('fivemCrashZones',JSON.stringify(zones));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const toMap=(cx,cy)=>({x:(cx-tx)/s,y:(cy-ty)/s});
function render(){svg.innerHTML='';zones.forEach((z,i)=>{let g=document.createElementNS('http://www.w3.org/2000/svg','g');let c=document.createElementNS(g.namespaceURI,'circle');c.setAttribute('cx',z.x);c.setAttribute('cy',z.y);c.setAttribute('r',z.r);c.setAttribute('class','zone'+(sel===i?' sel':''));c.onpointerdown=e=>{e.stopPropagation();sel=i;delBtn.disabled=false;render();if(edit){let p=toMap(e.clientX,e.clientY);act={type:'move',i,dx:p.x-z.x,dy:p.y-z.y};svg.setPointerCapture(e.pointerId)}};let t=document.createElementNS(g.namespaceURI,'text');t.setAttribute('x',z.x);t.setAttribute('y',z.y-z.r-12);t.setAttribute('text-anchor','middle');t.setAttribute('class','label');t.textContent=z.name;g.append(c,t);if(edit&&sel===i){let h=document.createElementNS(g.namespaceURI,'circle');h.setAttribute('cx',z.x+z.r);h.setAttribute('cy',z.y);h.setAttribute('r',13);h.setAttribute('class','handle');h.onpointerdown=e=>{e.stopPropagation();act={type:'resize',i};svg.setPointerCapture(e.pointerId)};g.append(h)}svg.append(g)})}
function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}function fit(){s=Math.max(innerWidth/W,innerHeight/H);tx=(innerWidth-W*s)/2;ty=(innerHeight-H*s)/2;apply()}function zoom(f,cx,cy){let old=s;s=clamp(s*f,.5,5);let wx=(cx-tx)/old,wy=(cy-ty)/old;tx=cx-wx*s;ty=cy-wy*s;apply()}
vp.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)};vp.onpointerdown=e=>{if(edit){if(e.target===svg){let p=toMap(e.clientX,e.clientY);if(p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H){pending=p;nameIn.value=`Crash zone ${zones.length+1}`;radIn.value=70;dlg.showModal()}}return}mapDrag={sx:e.clientX,sy:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId)};vp.onpointermove=e=>{if(act){let p=toMap(e.clientX,e.clientY),z=zones[act.i];if(act.type==='move'){z.x=clamp(p.x-act.dx,z.r,W-z.r);z.y=clamp(p.y-act.dy,z.r,H-z.r)}else{let dx=p.x-z.x,dy=p.y-z.y,max=Math.min(z.x,W-z.x,z.y,H-z.y,300);z.r=clamp(Math.hypot(dx,dy),20,max)}render();return}if(mapDrag){tx=mapDrag.tx+e.clientX-mapDrag.sx;ty=mapDrag.ty+e.clientY-mapDrag.sy;apply()}};function end(){if(act){save();act=null;render()}mapDrag=null}vp.onpointerup=end;vp.onpointercancel=end;
dlg.onclose=()=>{if(dlg.returnValue==='save'&&pending){zones.push({x:Math.round(pending.x),y:Math.round(pending.y),r:+radIn.value,name:nameIn.value.trim()||`Crash zone ${zones.length+1}`});sel=zones.length-1;save();delBtn.disabled=false;render()}pending=null};editBtn.onclick=()=>{edit=!edit;editBtn.textContent=`Edit: ${edit?'ON':'OFF'}`;editBtn.classList.toggle('on',edit);vp.style.cursor=edit?'crosshair':'grab';help.textContent=edit?'Click empty map to add • drag a circle to move • drag white handle to resize':'Drag to move • Mouse wheel to zoom';if(!edit){sel=null;delBtn.disabled=true}render()};delBtn.onclick=()=>{if(sel===null)return;if(confirm(`Delete "${zones[sel].name}"?`)){zones.splice(sel,1);sel=null;delBtn.disabled=true;save();render()}};document.querySelector('#zin').onclick=()=>zoom(1.2,innerWidth/2,innerHeight/2);document.querySelector('#zout').onclick=()=>zoom(.83,innerWidth/2,innerHeight/2);document.querySelector('#reset').onclick=fit;onresize=fit;render();fit();
</script></body></html>
